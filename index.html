<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YT Favorites</title>
<meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- Top bar: logo + search entry point -->
  <header id="top-bar">
    <div class="logo">YT Favorites</div>
    <nav id="top-nav">
      <button class="focusable nav-btn" id="nav-home" data-view="view-home">Home</button>
      <button class="focusable nav-btn" id="nav-search" data-view="view-search">Search</button>
    </nav>
  </header>

  <!-- HOME VIEW -->
  <section class="view active" id="view-home">
    <section class="row-section" id="section-continue">
      <h2>Continue Watching</h2>
      <div class="row" id="history-row"></div>
    </section>

    <section class="row-section" id="section-favorites">
      <h2>Favorite Channels</h2>
      <div class="row" id="favorites-row"></div>
      <p class="empty-hint" id="favorites-empty" style="display:none;">
        No favorite channels yet. Press Search to find and add channels.
      </p>
    </section>
  </section>

  <!-- SEARCH VIEW -->
  <section class="view" id="view-search">
    <div class="search-bar-wrap">
      <input type="text" id="search-input" class="focusable" placeholder="Search for a YouTube channel..." />
      <button id="search-btn" class="focusable nav-btn">Search</button>
    </div>
    <div class="grid" id="search-results"></div>
  </section>

  <!-- CHANNEL VIEW -->
  <section class="view" id="view-channel">
    <div id="channel-header">
      <img id="channel-thumb" src="" alt="">
      <div>
        <h2 id="channel-title"></h2>
        <button class="focusable nav-btn" id="channel-fav-btn">Add to Favorites</button>
      </div>
    </div>
    <div class="grid" id="channel-videos"></div>
  </section>

  <!-- PLAYER VIEW -->
  <section class="view" id="view-player">
    <div id="player-container"></div>
    <div id="player-info">
      <h2 id="player-title"></h2>
      <div id="player-channel"></div>
    </div>
  </section>

</div>

<script src="$WEBOS_TV_SSL$/webOSTV.js"></script>
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/navigation.js"></script>
<script src="js/youtubeApi.js"></script>
<script src="js/player.js"></script>
<script src="js/app.js"></script>
</body>
</html>
